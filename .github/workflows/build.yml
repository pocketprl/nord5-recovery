name: Build AERA (lexus)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: "AERA manifest branch"
        required: true
        default: "aera-16.0"
      SOURCE:
        description: "pinned = exact commits in manifest/aera-16.0-pinned.xml (same as local); branch = AERA's latest"
        type: choice
        options: [pinned, branch]
        default: pinned
      BUILD_VARIANT:
        description: "lunch variant (eng keeps root adb for bring-up)"
        required: true
        default: "eng"

jobs:
  # About a minute; catches config mistakes before the ~18 minute sync
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: device-tree
      - name: Fetch AERA recovery sources (shallow)
        run: |
          git clone --depth 1 -b ${{ inputs.MANIFEST_BRANCH }} https://github.com/AERA-Recovery/android_bootable_recovery aera-recovery
          git clone --depth 1 -b ${{ inputs.MANIFEST_BRANCH }} https://github.com/AERA-Recovery/android_vendor_recovery aera-vendor
          git clone --depth 1 -b ${{ inputs.MANIFEST_BRANCH }} https://github.com/AERA-Recovery/android_vendor_twrp vendor-twrp
      - name: Lint device tree
        run: VENDOR_TWRP=vendor-twrp device-tree/tools/aera-lint.sh aera-recovery aera-vendor device-tree
      - name: Bring-up script behaviour tests
        run: |
          command -v bc >/dev/null || sudo apt-get install -y bc
          device-tree/tools/test/run-tool-tests.sh device-tree/tools | diff -u device-tree/tools/test/expected.txt -

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEVICE: lexus
      DEVICE_PATH: device/oneplus/lexus
    steps:
      # On the ubuntu-26.04 runners /mnt is on the root filesystem, so the
      # action's "temp disk" volume (temp free - temp-reserve) ate the root
      # reserve and left / at exactly temp-reserve-mb (100 MB) in every run.
      # Run 9 died in apt-get update with "No space left". Reserve on both
      # sides so / keeps ~10 GB on either layout. Disk swap is only a fallback
      # behind zram now, so it shrinks to 4 GB and the build volume stays the
      # same size. (It has to run before zram: the action does `swapoff -a`.)
      - name: Free disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 14336
          temp-reserve-mb: 10240
          swap-size-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
          build-mount-path: /home/runner/aera

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs bc bison flex libssl-dev rsync zip unzip python3 ccache
          # Google's launcher: apt's is old and nags on every repo command
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+rx /usr/local/bin/repo
          repo version | head -3
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          df -h / /home/runner/aera
          free -h
          # Fail here, with a clear message, rather than mid-build
          root_free=$(df --output=avail -m / | tail -1)
          [ "$root_free" -ge 2048 ] || { echo "[!!] only ${root_free} MB free on / after cleanup"; exit 1; }

      # soong_build's Go heap outgrows the runner's 16 GB. Disk swap alone stalls
      # the whole VM (runs 5 and 6: silent for 40+ min, even the heartbeat froze).
      # Compressed swap in RAM is what the TWRP-16 builds that finish on these
      # same runners use (adontoo/twrp_device_oplus_sm86xx); disk swap stays as
      # a lower-priority fallback.
      - name: Setup zram swap
        run: |
          sudo modprobe zram 2>/dev/null || {
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe zram
          }
          size_k=$(( $(awk '/^MemTotal/{print $2}' /proc/meminfo) * 9 / 10 ))
          dev=$(sudo zramctl --find --size "${size_k}K" --algorithm lz4)
          sudo mkswap "$dev" >/dev/null
          sudo swapon --priority 1000 "$dev"
          # The kernel should prefer compressing over dropping file cache
          sudo sysctl -w vm.swappiness=180 vm.page-cluster=0
          swapon --show
          free -h

      # Before the sync: the pinned manifest lives in the device tree
      - name: Check out device tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      # ~17 min normally. Not cacheable: ~30 GB vs the 10 GB per-repo cache limit.
      # A stuck sync (googlesource throttling shared runner IPs) fails here
      # instead of running into the 6 h job limit.
      - name: Sync AERA source (shallow)
        timeout-minutes: 45
        working-directory: /home/runner/aera
        run: |
          repo init -u https://github.com/AERA-Recovery/android_manifest.git \
            -b ${{ inputs.MANIFEST_BRANCH }} --depth=1 --no-clone-bundle
          if [ "${{ inputs.SOURCE }}" != "branch" ]; then
            # Exact commits of the last known-good source (repo manifest -r)
            cp "$GITHUB_WORKSPACE/device-tree/manifest/aera-16.0-pinned.xml" .repo/manifests/lexus-pinned.xml
            repo init -m lexus-pinned.xml
            echo "[*] source: pinned manifest"
          else
            echo "[*] source: ${{ inputs.MANIFEST_BRANCH }} branch heads"
          fi
          # `repo list` only shows checked-out projects (0 right after init);
          # the resolved manifest has the real count (411 for aera-16.0)
          total=$(repo manifest | grep -c '<project ')
          echo "[*] syncing $total projects"
          # repo is silent without a terminal; print real progress every minute.
          # -prune keeps find out of the git object stores.
          (start=$(date +%s); while sleep 60; do
             fetched=$(find .repo/project-objects -name '*.git' -type d -prune 2>/dev/null | wc -l)
             checked=$(find . -path ./.repo -prune -o -name .git -prune -print 2>/dev/null | wc -l)
             echo "[*] $(( ($(date +%s)-start)/60 )) min | .repo $(du -sh .repo 2>/dev/null | cut -f1) | fetched $fetched/$total | checked out $checked/$total"
           done) &
          hb=$!
          rc=0
          time repo sync -c --no-tags --no-clone-bundle --optimized-fetch --force-sync \
            --retry-fetches=5 -j"$(nproc)" || rc=$?
          kill $hb 2>/dev/null || true
          du -sh .
          exit $rc

      - name: Place device tree
        run: |
          mkdir -p "/home/runner/aera/$(dirname "$DEVICE_PATH")"
          mv "$GITHUB_WORKSPACE/device-tree" "/home/runner/aera/$DEVICE_PATH"
          rm -rf "/home/runner/aera/$DEVICE_PATH/.git"

      # Restore and save are separate so a failed build still saves its compile
      # cache (actions/cache only saves when the whole job succeeds).
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/aera/.ccache
          key: ccache-lexus-${{ github.run_id }}
          restore-keys: ccache-lexus-

      - name: Build recovery image
        # Backstop only; the soft timeout below fires first and leaves diagnostics.
        # (A job cancelled or killed mid-step can lose its whole log.)
        timeout-minutes: 290
        working-directory: /home/runner/aera
        run: |
          export USE_CCACHE=1 CCACHE_EXEC="$(command -v ccache)" CCACHE_DIR="$PWD/.ccache"
          export CCACHE_COMPRESS=1 CCACHE_COMPRESSLEVEL=6
          # 4 GB keeps two cache generations inside the 10 GB repo limit
          ccache -M 4G
          ccache -z
          source build/envsetup.sh
          lunch twrp_${DEVICE}-bp2a-${{ inputs.BUILD_VARIANT }}
          # soong_build/kati print nothing for a long time; report phase, memory
          # and soong's own log every minute
          "$DEVICE_PATH/tools/ci/heartbeat.sh" "$PWD" 60 &
          hb=$!
          rc=0
          # m/mka are shell functions timeout(1) cannot run; call what m wraps
          timeout --signal=INT --kill-after=2m 270m build/soong/soong_ui.bash --make-mode adbd recoveryimage || rc=$?
          kill $hb 2>/dev/null || true
          if [ $rc -ne 0 ]; then
            [ $rc -eq 124 ] && echo "[!!] build hit the 270 min soft timeout (ccache is still saved; rerun to continue)" || echo "[!!] build failed (exit $rc)"
            echo "── memory ──"; free -h
            echo "── top processes by rss ──"; ps -eo rss=,etime=,comm= --sort=-rss | head -8 | awk '{printf "  %6.1fG  %10s  %s\n", $1/1048576, $2, $3}'
            echo "── OOM killer ──"; sudo dmesg 2>/dev/null | grep -iE 'out of memory|killed process' | tail -5 || echo "  none"
            echo "── out/soong.log (last 30) ──"; tail -30 out/soong.log 2>/dev/null || echo "  none"
            echo "── out/error.log ──"; tail -40 out/error.log 2>/dev/null || echo "  none"
          fi
          exit $rc

      - name: ccache stats
        id: ccache_stats
        if: always()
        working-directory: /home/runner/aera
        run: |
          # hashFiles() only sees the workspace, so record emptiness here instead
          if [ -n "$(find .ccache -type f -print -quit 2>/dev/null)" ]; then
            CCACHE_DIR="$PWD/.ccache" ccache -s
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "no ccache data (build never reached compilation)"
          fi

      - name: Save ccache
        if: always() && steps.ccache_stats.outputs.has_data == 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/aera/.ccache
          key: ccache-lexus-${{ github.run_id }}

      - name: Collect artifacts
        id: art
        working-directory: /home/runner/aera
        run: |
          O=out/target/product/$DEVICE
          D=$(date +%Y%m%d)
          mkdir -p /home/runner/dist
          cp $O/recovery.img /home/runner/dist/AERA-lexus-$D-${{ github.run_number }}.img
          (cd $O/recovery/root && find . -type f | sort) > /home/runner/dist/ramdisk-files.txt
          sha256sum /home/runner/dist/*.img | tee /home/runner/dist/SHA256SUMS
          ls -la /home/runner/dist
          echo "tag=lexus-$D-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.art.outputs.tag }}
          name: AERA lexus ${{ steps.art.outputs.tag }}
          prerelease: true
          files: /home/runner/dist/*
